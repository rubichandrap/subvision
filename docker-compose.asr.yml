# Optional Parakeet ASR worker for local measurement of the Parakeet path.
# Pass the downloaded model directory as PARAKEET_MODEL_DIR, or place it under
# ./models/parakeet before using this profile:
#   PARAKEET_MODEL_DIR=/path/to/parakeet-tdt-0.6b-v3-int8 \
#     docker compose -f docker-compose.yml -f docker-compose.override.yml \
#       -f docker-compose.asr.yml up --build -d asr server
#
# The model directory is mounted read-only and must contain the pinned
# Parakeet TDT v3 int8 files (encoder/decoder/joiner/tokens).
services:
  asr:
    build:
      context: ./tools/asr-worker
    environment:
      PARAKEET_MODEL_DIR: /models
    volumes:
      - ${PARAKEET_MODEL_DIR:-./models/parakeet}:/models:ro
    # Internal only: the server reaches it as http://asr:8081/transcribe.
    # No host port is published so it cannot clash with anything on 8081.
    restart: unless-stopped
