services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      # Build steps talk to apt and the Go module proxy; host networking
      # sidesteps the flaky NAT path WSL2 gives the default bridge.
      network: host
    container_name: subvision-server
    ports:
      - "8080:8080"
    env_file:
      - ./server/.env
    volumes:
      - ./server/third_party/whisper.cpp/bindings/go/models:/app/third_party/whisper.cpp/bindings/go/models
      - ./server/data:/app/data
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  vfx:
    build:
      context: ./vfx
      dockerfile: Dockerfile
      network: host
    container_name: subvision-vfx
    env_file:
      - ./vfx/.env
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      network: host
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:8080}
    container_name: subvision-client
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env
    restart: always
    depends_on:
      - server

  rustfs:
    image: rustfs/rustfs:latest
    container_name: subvision-rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: rustfs
      RUSTFS_SECRET_KEY: rustfs123
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:3-management
    container_name: subvision-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      # check_port_connectivity, not `ping`: the Erlang node answers RPC
      # before the AMQP listener on 5672 opens, so `ping` declares the
      # service healthy seconds before any client could actually connect.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 12

  createbuckets:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfs
      AWS_SECRET_ACCESS_KEY: rustfs123
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: >
      /bin/sh -c "
      echo '{"Version":"2012-10-17","Statement":[{"Sid":"PublicReadGetObject","Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::subvision/*"}]}' > /tmp/policy.json;
      aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket subvision || true;
      aws --endpoint-url http://rustfs:9000 s3api put-bucket-policy --bucket subvision --policy file:///tmp/policy.json || true;
      exit 0;
      "

volumes:
  rustfs-data:
